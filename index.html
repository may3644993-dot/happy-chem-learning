        // 翻頁功能實作
        function changePage(delta) {
            const classId = state.currentClassId; 
            const activeTabId = state.currentTabId[classId];
            if (!activeTabId) return;

            const activeTab = state.tabs[classId].find(t => t.id === activeTabId);
            if (!activeTab || activeTab.type !== 'pdf') return;

            const newPage = activeTab.currentPage + delta;
            if (newPage >= 1 && newPage <= activeTab.totalPages) {
                activeTab.currentPage = newPage;
                saveState();
                renderCurrentTab();
            }
        }

        function handlePointerDown(e) {
            const classId = state.currentClassId; const activeTabId = state.currentTabId[classId];
            if (!activeTabId) return;

            const activeTab = state.tabs[classId].find(t => t.id === activeTabId);
            const key = `${classId}_${activeTabId}_${activeTab.currentPage}`;
            if (!state.drawings[key]) state.drawings[key] = [];

            isMouseDown = true;
            const pt = getCanvasPos(e);
            state.lastMousePt = pt;

            if (state.pendingPasteClick) {
                pasteObjectsAt(pt); state.pendingPasteClick = false; hideBanner(); return;
            }

            if (isSpacePressed) {
                dragStartPt = { x: e.clientX - state.panX, y: e.clientY - state.panY };
                drawingCanvas.style.cursor = 'grabbing'; return;
            }

            hideContextMenus();

            if (state.currentTool === 'pen' || state.currentTool === 'highlighter') {
                pushUndoState();
                activeStroke = {
                    id: 'stroke-' + Date.now(), type: 'stroke', tool: state.currentTool,
                    color: state.brushColor, size: state.brushSize, points: [pt]
                };
                straightenStartPt = pt; holdStillPt = pt; isStraightened = false; lastTimerPt = pt;
                resetStraightenTimer(pt);

            } else if (state.currentTool === 'eraser') {
                isErasingHistoryPushed = false; isEraserModified = false; eraseAtPoint(pt, key);

            } else if (state.currentTool === 'stamp') {
                pushUndoState(); isDrawingStamp = true; stampStartPt = pt;
                activePreviewStamp = {
                    stampType: state.selectedStamp, x: pt.x, y: pt.y, scaleSize: 60,
                    angle: 0, color: state.brushColor, size: state.brushSize
                };

            } else if (state.currentTool === 'lasso') {
                if (selectedLassoObjects.length > 0) {
                    const bbox = getBoundingBox(selectedLassoObjects);
                    const handleKey = hitTestResizeHandle(pt, bbox);
                    if (handleKey) {
                        isResizingSelection = true; activeResizeHandle = handleKey;
                        initialResizeBbox = bbox; initialResizePt = pt;
                        initialObjectsSnapshot = JSON.parse(JSON.stringify(selectedLassoObjects));
                        pushUndoState(); return;
                    }
                    if (pt.x >= bbox.x && pt.x <= bbox.x + bbox.width && pt.y >= bbox.y && pt.y <= bbox.y + bbox.height) {
                        isDraggingSelection = true; dragStartPt = pt; pushUndoState(); return;
                    }
                }
                const hitObj = findHitObject(pt, key);
                if (hitObj) {
                    selectedLassoObjects = [hitObj]; isDraggingSelection = true; dragStartPt = pt; pushUndoState(); redrawWorkspace(); return;
                }
                selectedLassoObjects = []; lassoPath = [pt];

            } else if (state.currentTool === 'crop') {
                isCropping = true; cropStartPt = pt; cropEndPt = pt;
            }
            redrawWorkspace();
        }

        function handlePointerMove(e) {
            if (!isMouseDown) return;
            const classId = state.currentClassId; const activeTabId = state.currentTabId[classId];
            if (!activeTabId) return;

            const activeTab = state.tabs[classId].find(t => t.id === activeTabId);
            const key = `${classId}_${activeTabId}_${activeTab.currentPage}`;
            const pt = getCanvasPos(e); lastTimerPt = pt;

            if (isSpacePressed) {
                state.panX = e.clientX - dragStartPt.x; state.panY = e.clientY - dragStartPt.y; updateWorkspaceTransform(); return;
            }

            if (state.currentTool === 'pen' || state.currentTool === 'highlighter') {
                if (activeStroke) {
                    const lastPt = activeStroke.points[activeStroke.points.length - 1];
                    if (!lastPt || Math.hypot(pt.x - lastPt.x, pt.y - lastPt.y) > 0.5) {
                        if (!isStraightened) { activeStroke.points.push(pt); resetStraightenTimer(pt); }
                        else activeStroke.points[1] = pt;
                        redrawWorkspace();
                    }
                }

            } else if (state.currentTool === 'eraser') {
                eraseAtPoint(pt, key);

            } else if (state.currentTool === 'stamp' && isDrawingStamp && activePreviewStamp) {
                const dist = Math.hypot(pt.x - stampStartPt.x, pt.y - stampStartPt.y);
                const angle = Math.atan2(pt.y - stampStartPt.y, pt.x - stampStartPt.x);
                activePreviewStamp.scaleSize = Math.max(30, dist); activePreviewStamp.angle = angle;
                redrawWorkspace();

            } else if (state.currentTool === 'lasso') {
                if (isDraggingSelection && selectedLassoObjects.length > 0) {
                    const dx = pt.x - dragStartPt.x; const dy = pt.y - dragStartPt.y; dragStartPt = pt;
                    selectedLassoObjects.forEach(obj => {
                        if (obj.type === 'stroke') obj.points.forEach(p => { p.x += dx; p.y += dy; });
                        else if (obj.type === 'image') { obj.x += dx; obj.y += dy; }
                    });
                    redrawWorkspace();
                } else if (isResizingSelection && selectedLassoObjects.length > 0) {
                    const dx = pt.x - initialResizePt.x; const dy = pt.y - initialResizePt.y;
                    let newBbox = { ...initialResizeBbox };
                    if (activeResizeHandle === 'br') { newBbox.width = Math.max(20, initialResizeBbox.width + dx); newBbox.height = Math.max(20, initialResizeBbox.height + dy); }
                    else if (activeResizeHandle === 'bl') { newBbox.width = Math.max(20, initialResizeBbox.width - dx); if (newBbox.width > 20) newBbox.x = initialResizeBbox.x + dx; newBbox.height = Math.max(20, initialResizeBbox.height + dy); }
                    else if (activeResizeHandle === 'tr') { newBbox.width = Math.max(20, initialResizeBbox.width + dx); newBbox.height = Math.max(20, initialResizeBbox.height - dy); if (newBbox.height > 20) newBbox.y = initialResizeBbox.y + dy; }
                    else if (activeResizeHandle === 'tl') { newBbox.width = Math.max(20, initialResizeBbox.width - dx); if (newBbox.width > 20) newBbox.x = initialResizeBbox.x + dx; newBbox.height = Math.max(20, initialResizeBbox.height - dy); if (newBbox.height > 20) newBbox.y = initialResizeBbox.y + dy; }

                    const scaleX = newBbox.width / initialResizeBbox.width; const scaleY = newBbox.height / initialResizeBbox.height;
                    selectedLassoObjects.forEach((obj, idx) => {
                        const initObj = initialObjectsSnapshot[idx];
                        if (obj.type === 'stroke') obj.points = initObj.points.map(p => ({ x: newBbox.x + (p.x - initialResizeBbox.x) * scaleX, y: newBbox.y + (p.y - initialResizeBbox.y) * scaleY }));
                        else if (obj.type === 'image') { obj.x = newBbox.x + (initObj.x - initialResizeBbox.x) * scaleX; obj.y = newBbox.y + (initObj.y - initialResizeBbox.y) * scaleY; obj.width = initObj.width * scaleX; obj.height = initObj.height * scaleY; }
                    });
                    redrawWorkspace();
                } else {
                    lassoPath.push(pt); redrawWorkspace();
                }

            } else if (state.currentTool === 'crop') {
                cropEndPt = pt; redrawWorkspace();
            }
        }

        // 處理滑鼠、觸控筆或手指抬起時的邏輯 (解決即時儲存、無遮罩截圖問題)
        function handlePointerUp(e) {
            if (!isMouseDown) return;
            isMouseDown = false;
            
            const classId = state.currentClassId; 
            const activeTabId = state.currentTabId[classId];
            if (!activeTabId) return;

            const activeTab = state.tabs[classId].find(t => t.id === activeTabId);
            const key = `${classId}_${activeTabId}_${activeTab.currentPage}`;
            
            if (state.currentTool === 'pen' || state.currentTool === 'highlighter') {
                if (activeStroke && activeStroke.points && activeStroke.points.length > 0) {
                    if (!state.drawings[key]) state.drawings[key] = [];
                    state.drawings[key].push(activeStroke);
                    saveState(); // 確保筆劃即時儲存
                }
                activeStroke = null;
                clearTimeout(straightLineTimer);
                
            } else if (state.currentTool === 'eraser') {
                saveState(); // 確保擦除即時儲存
                
            } else if (state.currentTool === 'stamp' && isDrawingStamp && activePreviewStamp) {
                isDrawingStamp = false;
                const tempStrokes = convertStampToStrokes(activePreviewStamp);
                if (!state.drawings[key]) state.drawings[key] = [];
                state.drawings[key].push(...tempStrokes);
                activePreviewStamp = null;
                saveState();
                redrawWorkspace();
                
            } else if (state.currentTool === 'lasso') {
                if (isDraggingSelection) {
                    isDraggingSelection = false;
                    saveState();
                } else if (isResizingSelection) {
                    isResizingSelection = false;
                    activeResizeHandle = null;
                    saveState();
                } else {
                    if (lassoPath.length > 2) {
                        const objects = state.drawings[key] || [];
                        selectedLassoObjects = [];
                        objects.forEach(obj => {
                            if (obj.type === 'stroke') {
                                let inside = false;
                                for (let p of obj.points) {
                                    if (pointInPolygon(p, lassoPath)) { inside = true; break; }
                                }
                                if (inside) selectedLassoObjects.push(obj);
                            } else if (obj.type === 'image') {
                                const center = { x: obj.x + obj.width/2, y: obj.y + obj.height/2 };
                                if (pointInPolygon(center, lassoPath)) selectedLassoObjects.push(obj);
                            }
                        });
                        
                        if (selectedLassoObjects.length > 0) {
                            showToast(`已選取 ${selectedLassoObjects.length} 個物件`);
                        }
                    }
                    lassoPath = [];
                }
                redrawWorkspace();
                
            } else if (state.currentTool === 'crop') {
                isCropping = false; // 先將裁切狀態關閉
                redrawWorkspace();  // 重新渲染畫布，這會消除畫布上的橘色裁切框線

                if (cropStartPt && cropEndPt) {
                    const x = Math.min(cropStartPt.x, cropEndPt.x);
                    const y = Math.min(cropStartPt.y, cropEndPt.y);
                    const w = Math.abs(cropEndPt.x - cropStartPt.x);
                    const h = Math.abs(cropEndPt.y - cropStartPt.y);
                    
                    if (w > 10 && h > 10) {
                        // 稍微延遲讓瀏覽器有時間把乾淨無橘色框的畫布畫出來後再擷圖
                        setTimeout(() => {
                            showExportCropPreview(x, y, w, h);
                            cropStartPt = null; cropEndPt = null;
                            document.getElementById('tool-pen').click(); // 裁切完切回筆刷
                        }, 50);
                    } else {
                        cropStartPt = null; cropEndPt = null;
                        document.getElementById('tool-pen').click();
                    }
                } else {
                    cropStartPt = null; cropEndPt = null;
                    document.getElementById('tool-pen').click();
                }
            }
        }

        // 圖片精準裁切處理程式
        function setupImageCroppingHandlers() {
            const cropModal = document.getElementById('image-crop-modal');
            const closeBtn = document.getElementById('close-crop-modal-btn');
            const cancelBtn = document.getElementById('cancel-crop-btn');
            const applyBtn = document.getElementById('apply-crop-btn');
            const resetBtn = document.getElementById('reset-original-img-btn');
            const cropBox = document.getElementById('crop-box');
            const targetImg = document.getElementById('crop-target-img');
            const container = document.getElementById('crop-container');

            setupFastClick(lassoCropImgBtn, () => {
                if (!currentTargetImgObj) return;
                targetImg.src = currentTargetImgObj.dataUrl;
                cropModal.classList.remove('hidden');
                
                // Initialize crop box to full image or previous crop
                setTimeout(() => {
                    const imgRect = targetImg.getBoundingClientRect();
                    const containerRect = container.getBoundingClientRect();
                    const offsetX = imgRect.left - containerRect.left;
                    const offsetY = imgRect.top - containerRect.top;
                    
                    cropBox.style.left = offsetX + 'px';
                    cropBox.style.top = offsetY + 'px';
                    cropBox.style.width = imgRect.width + 'px';
                    cropBox.style.height = imgRect.height + 'px';
                }, 100);
            });

            const closeModal = () => { cropModal.classList.add('hidden'); currentTargetImgObj = null; };
            setupFastClick(closeBtn, closeModal);
            setupFastClick(cancelBtn, closeModal);

            setupFastClick(resetBtn, () => {
                if (!currentTargetImgObj || !currentTargetImgObj.originalDataUrl) return;
                pushUndoState();
                
                const img = new Image();
                img.src = currentTargetImgObj.originalDataUrl;
                img.onload = () => {
                    currentTargetImgObj.dataUrl = currentTargetImgObj.originalDataUrl;
                    currentTargetImgObj.imgElement = img;
                    currentTargetImgObj.width = img.naturalWidth || currentTargetImgObj.width;
                    currentTargetImgObj.height = img.naturalHeight || currentTargetImgObj.height;
                    
                    saveState(); redrawWorkspace(); closeModal();
                    showToast("已恢復原始全圖！");
                };
            });

            setupFastClick(applyBtn, () => {
                if (!currentTargetImgObj) return;
                pushUndoState();

                const imgRect = targetImg.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                
                const boxLeft = parseFloat(cropBox.style.left);
                const boxTop = parseFloat(cropBox.style.top);
                const boxWidth = parseFloat(cropBox.style.width);
                const boxHeight = parseFloat(cropBox.style.height);

                const imgOffsetX = imgRect.left - containerRect.left;
                const imgOffsetY = imgRect.top - containerRect.top;

                // Calculate relative crop coordinates
                const relX = (boxLeft - imgOffsetX) / imgRect.width;
                const relY = (boxTop - imgOffsetY) / imgRect.height;
                const relW = boxWidth / imgRect.width;
                const relH = boxHeight / imgRect.height;

                // Create a canvas to crop the image
                const tempCanvas = document.createElement('canvas');
                const natW = targetImg.naturalWidth;
                const natH = targetImg.naturalHeight;
                
                const cropX = Math.max(0, relX * natW);
                const cropY = Math.max(0, relY * natH);
                const cropW = Math.min(natW - cropX, relW * natW);
                const cropH = Math.min(natH - cropY, relH * natH);

                tempCanvas.width = cropW;
                tempCanvas.height = cropH;
                const tCtx = tempCanvas.getContext('2d');
                tCtx.drawImage(targetImg, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

                const newUrl = tempCanvas.toDataURL('image/png');
                const newImg = new Image();
                newImg.src = newUrl;
                newImg.onload = () => {
                    currentTargetImgObj.dataUrl = newUrl;
                    currentTargetImgObj.imgElement = newImg;
                    // Adjust size proportionately
                    currentTargetImgObj.width = currentTargetImgObj.width * relW;
                    currentTargetImgObj.height = currentTargetImgObj.height * relH;
                    
                    saveState(); redrawWorkspace(); closeModal();
                    showToast("圖片裁切成功！");
                };
            });

            let isDragging = false;
            let isResizing = false;
            let currentHandle = null;
            let startX, startY, startLeft, startTop, startWidth, startHeight;

            cropBox.addEventListener('pointerdown', (e) => {
                if (e.target.classList.contains('crop-handle')) {
                    isResizing = true;
                    currentHandle = e.target.dataset.handle;
                } else {
                    isDragging = true;
                }
                startX = e.clientX;
                startY = e.clientY;
                startLeft = parseFloat(cropBox.style.left) || 0;
                startTop = parseFloat(cropBox.style.top) || 0;
                startWidth = parseFloat(cropBox.style.width) || 100;
                startHeight = parseFloat(cropBox.style.height) || 100;
                e.preventDefault();
                e.stopPropagation();
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging && !isResizing) return;
                
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                
                if (isDragging) {
                    cropBox.style.left = (startLeft + dx) + 'px';
                    cropBox.style.top = (startTop + dy) + 'px';
                } else if (isResizing) {
                    let newL = startLeft, newT = startTop, newW = startWidth, newH = startHeight;
                    
                    if (currentHandle.includes('l')) { newL = startLeft + dx; newW = startWidth - dx; }
                    if (currentHandle.includes('r')) { newW = startWidth + dx; }
                    if (currentHandle.includes('t')) { newT = startTop + dy; newH = startHeight - dy; }
                    if (currentHandle.includes('b')) { newH = startHeight + dy; }
                    
                    if (newW > 20) { cropBox.style.width = newW + 'px'; cropBox.style.left = newL + 'px'; }
                    if (newH > 20) { cropBox.style.height = newH + 'px'; cropBox.style.top = newT + 'px'; }
                }
            });

            window.addEventListener('pointerup', () => {
                isDragging = false;
                isResizing = false;
            });
        }
    </script>
